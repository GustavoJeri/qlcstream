# No application, database, torrent process, published port or personal mount.
services:
  prepare:
    image: alpine:3.23
    user: root
    network_mode: none
    command: [sh, /prepare-directories.sh]
    volumes: [media:/media, secrets:/secrets, ../../backend/docker/prepare-directories.sh:/prepare-directories.sh:ro]
  backend:
    build: ../../backend
    group_add: ["1000"]
    network_mode: none
    entrypoint: /bin/sh
    volumes: [media:/data]
  engine:
    image: qbittorrentofficial/qbittorrent-nox:latest
    network_mode: none
    entrypoint: [/bin/sh, -c]
    volumes: [media:/downloads]
  inspect:
    image: alpine:3.23
    user: root
    network_mode: none
    entrypoint: /bin/sh
    volumes: [media:/media, secrets:/secrets]
volumes:
  media:
  secrets:
